spring:
  config:
    # 환경 변수를 쓸 수 없는 호스팅용: 비밀 설정 파일을 선택적으로 읽음 (파일이 없으면 무시)
    # 1) 로컬 개발: 실행 위치 기준 ./config/secrets.properties
    # 2) 카페24 서버: war 재배포에도 유지되도록 war 밖(홈 디렉터리)에 둔 파일
    import: optional:file:./config/secrets.properties,optional:file:/home/hosting_users/hjungcwoo/config/secrets.properties
  mail:
    # Google smtp server 사용
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME} # 앱 비밀번호 발급받은 google 계정
    password: ${MAIL_PASSWORD} # 발급받은 앱 비밀번호
    properties:
      mail:
        smtp:
          starttls:
            enable: true
          auth: true
  datasource:
    # 기본값은 기존 설정과 동일. 로컬 개발 시 DB_URL 환경 변수로 localhost 주소를 지정하세요.
    url: ${DB_URL:jdbc:mariadb://finekorea.kr:3306/hjungcwoo?serverTimezone=UTC&characterEncoding=UTF-8&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

server:
  port: 8084
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true



